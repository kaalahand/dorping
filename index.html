        <h2>How it works</h2>
        <ol>
          <li><strong>You tell us about your parent.</strong> Who is the storyteller? What language do they speak? What part of their life are you most curious about?</li>

          <li><strong>Stories unfold across multiple sessions.</strong> One call captures one story. Over 8 to 12 sessions across a few weeks, a full life narrative takes shape.</li>
          <li><strong>We transform voice into a written narrative.</strong> Our AI transforms your parent's spoken words into a beautifully structured narrative written in their voice. You review, add photos, and approve each story.</li>
        </ol>

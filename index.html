<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Reminology — Your parents' stories, kept forever</title>
    <meta name="description" content="Reminology captures your parents' life stories on WhatsApp — in Hindi, Bengali, or Tamil — and turns them into a hardcover book delivered to your home in Europe. First 5 stories free." />
    <meta name="keywords" content="life story preservation, family memoir, WhatsApp story collection, hardcover book gift, oral history, family memories, preserve stories, Indian diaspora Europe, family legacy book, parent stories, intergenerational stories, multilingual storytelling, Hindi Bengali Tamil" />
    <meta name="author" content="Reminology" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Canonical URL -->

    <!-- Open Graph Meta Tags (Facebook, LinkedIn, WhatsApp previews) -->

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://reminology.com/og-image.png" />

    <meta name="language" content="English" />

    <meta name="format-detection" content="telephone=no" />

    <!-- Structured Data: Product / SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "Reminology",
      "description": "Reminology captures your parents' life stories on WhatsApp in Hindi, Bengali, or Tamil, then prints them as a beautiful hardcover book delivered to your home in Europe.",
      "url": "https://reminology.com",
      "brand": {
        "@type": "Brand",
        "name": "Reminology"
      },
      "offers": [
        {
          "@type": "Offer",
          "name": "Free Stories",
          "price": "0",
          "priceCurrency": "EUR",
          "description": "First 5 stories completely free — no card required"
        },
        {
          "@type": "Offer",
          "name": "Hardcover Book",
          "price": "49",
          "priceCurrency": "EUR",
          "description": "Printed hardcover book covering up to 25 stories, delivered within 5–10 business days in Europe"
        }
      ]
    }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Reminology",
      "url": "https://reminology.com",
      "description": "Reminology helps Indian diaspora families in Europe preserve their parents' life stories — captured on WhatsApp and delivered as a printed hardcover book.",
      "foundingDate": "2025",
      "areaServed": "Europe",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "url": "https://wa.me/+31630071724"
      }
    }
    </script>

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Does my parent need to download an app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Your parent receives a WhatsApp message from you with a simple link. They tap it, give a one-time consent, and begin talking. No download. No account. Just one tap on the app they already use every day."
          }
        },
        {
          "@type": "Question",
          "name": "Which languages are supported?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We currently support English and Hindi (Beta). Bengali launches in June 2026, with Tamil following in Phase 2. If your parent speaks a language not yet supported, join our waitlist and we prioritise based on demand."
          }
        },
        {
          "@type": "Question",
          "name": "What if the call drops or my parent gets disconnected?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The call link stays active. Your parent can reconnect at any time. The recording resumes and nothing is lost."
          }
        },
        {
          "@type": "Question",
          "name": "What happens to my parent's recording?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Recordings are encrypted and stored for 30 days after story delivery. You can request permanent deletion at any time by replying DELETE on WhatsApp. We are fully GDPR-compliant and EU-hosted."
          }
        },
        {
          "@type": "Question",
          "name": "When do I pay?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your first 5 stories are completely free, no card required. You only pay €49 when you decide to order the printed hardcover book, which covers up to 25 stories."
          }
        },
        {
          "@type": "Question",
          "name": "How long does delivery take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Books are printed on demand in the Netherlands and delivered within 5 to 10 business days to addresses in Europe."
          }
        }
      ]
    }
    </script>

    <!-- Structured Data: BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://reminology.com/"
        }
      ]
    }
    </script>

    <!-- Structured Data: WebSite (enables Google Sitelinks search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Reminology",
      "url": "https://reminology.com/",
      "description": "Preserve your parents' stories on WhatsApp. Receive a hardcover book your family keeps forever.",
      "inLanguage": ["en", "hi"]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
